apiVersion: agentctl.dev/v1
kind: Profile
metadata:
  name: strict
  description: >-
    No egress allowlist entries at all: default-deny with LAN blocked and
    nothing pre-approved. Start here for a maximally isolated sandbox and
    add --allow entries only as needed for the task at hand.
spec:
  network:
    denyLAN: true
    allow: []
    ports: []
  resources:
    cpuCores: 1
    memory: "2GiB"
    diskSize: "10GiB"
  mounts:
    - hostPath: "~/agentctl/workspaces/{{.Name}}"
      guestPath: "/workspace"
      writable: true
  mountPolicy:
    # The per-instance workspace is the only host directory this profile
    # will expose: allowedRoots confines every --mount to it, so an ad-hoc
    # create cannot reach the rest of the filesystem.
    allowedRoots:
      - "~/agentctl/workspaces"
    createMissing: true
  console:
    viewer: "spice"
