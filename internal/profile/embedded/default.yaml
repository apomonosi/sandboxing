apiVersion: agentctl.dev/v1
kind: Profile
metadata:
  name: default
  description: >-
    Baseline built-in profile, applied when no --profile is given and no
    defaultProfile is configured: default-deny egress, LAN blocked, modest
    resources, one per-instance workspace. Deliberately pre-approves no
    domains — egress comes from --agent (the agent's own install/API
    domains) and from composing an ecosystem profile such as
    --profile=python. A starting point to copy and adjust, not a
    one-size-fits-all production policy.
spec:
  network:
    denyLAN: true
    # Empty by design. This profile used to pre-approve *.anthropic.com
    # plus PyPI, which made the baseline both agent- and language-flavored:
    # a --agent=gemini user inherited an unused Anthropic grant, and a Go
    # user inherited Python registries. Those now live where they vary —
    # the agent registry (internal/agent) and the python profile.
    allow: []
    ports: []
  resources:
    cpuCores: 2
    memory: "4GiB"
    diskSize: "20GiB"
  mounts:
    - hostPath: "~/agentctl/workspaces/{{.Name}}"
      guestPath: "/workspace"
      writable: true
  mountPolicy:
    # Nothing of the host filesystem is exposed but the per-instance
    # workspace below. Add --mount entries (or allowedRoots here) to widen
    # that deliberately; $HOME itself is never mountable.
    createMissing: true
  console:
    viewer: "spice"
