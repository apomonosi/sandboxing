apiVersion: agentctl.dev/v1
kind: Profile
metadata:
  name: default
  description: >-
    Baseline built-in profile: default-deny egress, LAN blocked, modest
    resources. Intended as a starting point to copy and adjust, not as a
    one-size-fits-all production policy.
spec:
  network:
    denyLAN: true
    allow:
      # Concrete host, not "*.anthropic.com". A wildcard here does not do
      # what it looks like: the Incus backend resolves allow-rules to IP
      # addresses by stripping the "*." and resolving the apex, so
      # "*.anthropic.com" allow-listed the marketing site's address while
      # api.anthropic.com — the endpoint anything actually talks to —
      # stayed blocked. See TestBuiltins_NoWildcardDomains.
      - domain: "api.anthropic.com"
        ports: [443]
      - domain: "pypi.org"
        ports: [443]
      - domain: "files.pythonhosted.org"
        ports: [443]
    ports: []
  resources:
    cpuCores: 2
    memory: "4GiB"
    diskSize: "20GiB"
  mounts:
    - hostPath: "~/agentctl/workspaces/{{.Name}}"
      guestPath: "/workspace"
      writable: true
  mountPolicy:
    # Nothing of the host filesystem is exposed but the per-instance
    # workspace below. Add --mount entries (or allowedRoots here) to widen
    # that deliberately; $HOME itself is never mountable.
    createMissing: true
  console:
    viewer: "spice"
