apiVersion: agentctl.dev/v1
kind: Profile
metadata:
  name: python
  description: >-
    Ecosystem profile: PyPI access for a Python project. Carries egress
    entries only — no resources, mounts or mountPolicy — so it composes on
    top of a base profile rather than replacing it:
    --profile=default --profile=python
spec:
  network:
    # Repeated in every ecosystem profile rather than inherited: Merge
    # takes the override's denyLAN as-is, so a profile that omits it would
    # resolve to false and silently unblock the LAN when layered last.
    denyLAN: true
    allow:
      - domain: "pypi.org"
        ports: [443]
      # Package files are served from a separate host, so installs fail
      # with only pypi.org allowed.
      - domain: "files.pythonhosted.org"
        ports: [443]
    ports: []
